name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: plantflow
          POSTGRES_USER: plantflow
          POSTGRES_PASSWORD: plantflow_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plantflow -d plantflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://plantflow:plantflow_test_password@localhost:5432/plantflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q backend/app backend/tests
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python backend/tests/smoke_postgres.py
